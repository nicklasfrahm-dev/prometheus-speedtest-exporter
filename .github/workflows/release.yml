name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Resolve npm package versions
        id: versions
        run: |
          # Only ever install npm releases that have had at least 15 days to
          # be caught by the community/be pulled in case of a supply chain
          # compromise. Prereleases are skipped because they do not satisfy
          # the plugins' peer dependency ranges, and the highest version is
          # picked by semver rather than publish time so that backports to
          # older major versions are never selected.
          cutoff="$(date -u -d '15 days ago' +%Y-%m-%dT%H:%M:%SZ)"

          resolve() {
            npm view "$1" time --json \
              | jq -r --arg cutoff "$cutoff" '
                  to_entries
                  | map(select(.key | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  | map(select(.value <= $cutoff))
                  | sort_by(.key | split(".") | map(tonumber))
                  | last.key
                '
          }

          {
            echo "semantic-release=$(resolve semantic-release)"
            echo "commit-analyzer=$(resolve @semantic-release/commit-analyzer)"
            echo "release-notes-generator=$(resolve @semantic-release/release-notes-generator)"
            echo "github=$(resolve @semantic-release/github)"
            echo "exec=$(resolve @semantic-release/exec)"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@${{ steps.versions.outputs.semantic-release }} \
            -p @semantic-release/commit-analyzer@${{ steps.versions.outputs.commit-analyzer }} \
            -p @semantic-release/release-notes-generator@${{ steps.versions.outputs.release-notes-generator }} \
            -p @semantic-release/github@${{ steps.versions.outputs.github }} \
            -p @semantic-release/exec@${{ steps.versions.outputs.exec }} \
            semantic-release

  containerize:
    name: Containerize
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/nicklasfrahm-dev/prometheus-speedtest-exporter
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.release.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=v${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
