name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  check-pr-title:
    name: Check PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
          REGEX: '^(feat|fix)(\([a-zA-Z-]+\))?!?: [a-z].*'
        run: |
          echo "$TITLE" | grep -qP "$REGEX" || {
            echo "PR title does not match the required pattern: $REGEX"
            echo "Title: $TITLE"
            echo ""
            echo "Common gotchas:"
            echo "  - type must be exactly 'feat' or 'fix' (no 'chore', 'docs', 'ci', etc.)"
            echo "  - scope (optional, in parentheses) must be alphabetic characters and hyphens only, no digits/underscores/slashes/spaces"
            echo "  - exactly one space after the colon"
            echo "  - description must start with a lowercase letter"
            exit 1
          }

  containerize:
    name: Containerize
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: false
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

  lint:
    name: Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Read golangci-lint version
        id: golangci-lint-version
        run: echo "version=$(grep -oP 'GOLANGCI_LINT_VERSION\s*:=\s*\K\S+' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go coverage
        uses: gwatts/go-coverage-action@2845595538a59d63d1bf55f109c14e104c6f7cb3 # v2.0.0
        with:
          coverage-threshold: 0
          cover-pkg: ./...
